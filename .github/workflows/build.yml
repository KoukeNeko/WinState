name: build

on:
  push:
    branches: [dev, alpha, master]
    paths-ignore:
      - '**.md'
  pull_request:
    paths-ignore:
      - '**.md'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    strategy:
      fail-fast: false
      matrix:
        rid: [win-x64, win-arm64]

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Refresh contributors snapshot
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: ./scripts/fetch-contributors.ps1

      - name: Publish self-contained single-file exe
        run: >
          dotnet publish WinState.csproj
          -c Release
          -r ${{ matrix.rid }}
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=none
          -o publish

      - name: Upload exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: WinState-${{ matrix.rid }}
          path: publish/WinState.exe
          if-no-files-found: error
